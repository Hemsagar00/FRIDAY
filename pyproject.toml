[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-ai"
version = "0.1.0"
description = "FRIDAY — Personal AI Assistant Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Hemsagar", email = "your.email@example.com"},
]
keywords = ["ai", "assistant", "agent", "automation", "personal-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-telegram-bot>=20.7",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.4.18",
    "markdownify>=0.11.6",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]
voice = [
    "openai-whisper>=20231117",
    "elevenlabs>=0.2.0",
]
ui = [
    "websockets>=12.0",
]

[project.scripts]
friday = "friday.cli:main"

[project.urls]
Homepage = "https://github.com/Hemsagar00/FRIDAY"
Documentation = "https://github.com/Hemsagar00/FRIDAY#readme"
Issues = "https://github.com/Hemsagar00/FRIDAY/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["friday*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
